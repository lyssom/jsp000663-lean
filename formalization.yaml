  - source: cover witness contained in [1, N] when A ⊆ [1, N]
    lean: JSP000663.coverWitness_subset_of_small
    module: JSP000663.Tight
    status: proved
  - source: subset preservation: A ⊆ A' implies coverWitness A' covers A
    lean: JSP000663.coverWitness_twoCover_subset
    module: JSP000663.Tight
    status: proved
